name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-presumed-pass-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Evidence verdict contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  required:
    name: required
    if: always()
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce required API verification
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          set -eu
          echo "unit: $UNIT_RESULT"
          test "$UNIT_RESULT" = "success"
