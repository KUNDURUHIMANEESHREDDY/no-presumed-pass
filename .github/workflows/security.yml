name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: Python static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Analyze Python code
        uses: github/codeql-action/analyze@v3

  security-required:
    name: security-required
    if: always()
    needs: [secret-scan, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce required security verification
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -eu
          echo "secret-scan: $SECRET_SCAN_RESULT"
          echo "codeql: $CODEQL_RESULT"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"
